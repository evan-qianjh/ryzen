server:
  port: 8004

spring:
  application:
    name: ryzen-service-user
  profiles:
    active: dev
  cloud:
    inetutils:
      preferred-networks: 10.168
    consul:
#      host: 192.168.187.1
#      port: 8500
      discovery:
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
      config:
        prefixes: config
        default-context: application
        data-key: data
        format: yaml
        watch:
          enabled: true
          delay: 3000
    function:
      definition: 'userAccountSink;\
      userAccountSource;'
    stream:
      kafka:
        binder:
          brokers: ${ryzen.kafka.default.servers}
          configuration:
            auto.offset.reset: latest
      bindings:
        # ------------------------------------- producer -------------------------------------
        userAccountSink-out-0:
          destination: user.account
          content-type: application/json
        # ------------------------------------- consumer -------------------------------------
        userAccountSource-in-0:
          destination: user.account
          content-type: application/json
          group: ${spring.application.name}
  output:
    ansi:
      enabled: detect
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ryzen.mysql.default.host}/${ryzen.mysql.default.schema}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${ryzen.mysql.default.username}
    password: ${ryzen.mysql.default.password}
  data:
    redis:
      host: ${ryzen.redis.default.host}
      port: ${ryzen.redis.default.port}
      password: ${ryzen.redis.default.password}
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    auto-startup: true
    properties:
      org:
        quartz:
          jobStore:
            isClustered: true
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: qrtz_
          scheduler:
            instanceId: AUTO
            instanceName: ${spring.application.name}
          threadPool:
            threadCount: 2
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'cli'
      display-name: '命令行'
      paths-to-match:
        - '/cli/**'
    - group: 'user'
      display-name: '用户-APP'
      paths-to-match:
        - '/user/app/**'
    - group: 'tenant-app'
      display-name: '租户-APP'
      paths-to-match:
        - '/tenant/app/**'
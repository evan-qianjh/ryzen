plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(":ryzen-framework:ryzen-framework-security")
    implementation project(":ryzen-framework:ryzen-framework-token")
    implementation project(":ryzen-framework:ryzen-framework-service")

    implementation project(":ryzen-model:ryzen-model-user")

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'

    implementation libs.googleauth
    implementation libs.mybatis.plus.jsqlparser
    implementation libs.mybatis.plus.spring
    implementation libs.mybatis.plus.join
}

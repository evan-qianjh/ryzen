server:
  port: 8044
  shutdown: graceful

spring:
  application:
    name: ryzen-ims-rpa-scheduler
  profiles:
    active: test
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-critical-timeout: 2m
      config:
        prefixes: config
        default-context: application
        data-key: data
        format: yaml
        watch:
          enabled: true
          delay: 3000
  output:
    ansi:
      enabled: detect
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ryzen.mysql.default.host}/${ryzen.mysql.default.schema}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${ryzen.mysql.default.username}
    password: ${ryzen.mysql.default.password}
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
  kafka:
    bootstrap-servers: ${ryzen.kafka.default.servers:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'cli'
      display-name: '命令行'
      paths-to-match:
        - '/cli/**'
    - group: 'tenant-app'
      display-name: '租户-APP'
      paths-to-match:
        - '/tenant/app/**'

ryzen:
  scheduler:
    command-request-topic: ims.app-to-scheduler-command-request
    command-response-topic: ims.scheduler-to-app-command-response
    task-request-topic: ims.app-to-scheduler-task-request
    task-response-topic: ims.scheduler-to-app-task-response
    message-topic: ims.scheduler-to-app-message
    report-topic: ims.scheduler-to-app-report
    heartbeat-timeout-seconds: 30
    task-timeout-seconds: 60
    timeout-check-interval-seconds: 5
  executor:
    command-request-topic: ims.scheduler-to-executor-command-request
    command-response-topic: ims.executor-to-scheduler-command-response
    task-request-topic: ims.scheduler-to-executor-task-request
    task-response-topic: ims.executor-to-scheduler-task-response
    message-topic: ims.executor-to-scheduler-message
    register-topic: ims.executor-to-scheduler-register
    heartbeat-topic: ims.executor-to-scheduler-heartbeat
    status-topic: ims.executor-to-scheduler-status
server:
  port: 8043
  shutdown: graceful

spring:
  application:
    name: ryzen-ims-stream
  profiles:
    active: test
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-critical-timeout: 2m
      config:
        prefixes: config
        default-context: application
        data-key: data
        format: yaml
        watch:
          enabled: true
          delay: 3000
    function:
      definition: 'imsImMessageSink;imsSchedulerCommandResponseSource;imsSchedulerTaskResponseSource;imsSchedulerReportSource;imsSchedulerMessageSource;'
    stream:
      kafka:
        binder:
          brokers: ${ryzen.kafka.default.servers}
          configuration:
            auto.offset.reset: latest
      bindings:
        # ------------------------------------- sink -------------------------------------
        imsImMessageSink-out-0:
          destination: ims.im-message
          content-type: application/json
        # ------------------------------------- source -------------------------------------
        imsSchedulerCommandResponseSource-in-0:
          destination: ims.scheduler-command-response
          content-type: application/json
          group: ${spring.application.name}
        imsSchedulerTaskResponseSource-in-0:
          destination: ims.scheduler-task-response
          content-type: application/json
          group: ${spring.application.name}
        imsSchedulerReportSource-in-0:
          destination: ims.scheduler-report
          content-type: application/json
          group: ${spring.application.name}
        imsSchedulerMessageSource-in-0:
          destination: ims.scheduler-message
          content-type: application/json
          group: ${spring.application.name}
  output:
    ansi:
      enabled: detect
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ryzen.mysql.default.host}/${ryzen.mysql.default.schema}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${ryzen.mysql.default.username}
    password: ${ryzen.mysql.default.password}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'cli'
      display-name: '命令行'
      paths-to-match:
        - '/cli/**'

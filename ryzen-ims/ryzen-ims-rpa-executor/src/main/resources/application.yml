spring:
  application:
    name: ryzen-ims-rpa-executor
  profiles:
    active: test
  lifecycle:
    timeout-per-shutdown-phase: 30s
  output:
    ansi:
      enabled: detect
  main:
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers: ${ryzen.kafka.default.servers}
    consumer:
      group-id: ${spring.application.name}-${ryzen.executor.code}
      auto-offset-reset: latest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ryzen:
  executor:
    code: '1001'
    headless: false
    browser-channel: chrome
    collect-interval-seconds: 5
    heartbeat-interval-seconds: 10
    login-check-interval-seconds: 2
    register-topic: ims.executor-register
    heartbeat-topic: ims.executor-heartbeat
    status-topic: ims.executor-status
    message-topic: ims.executor-message
    command-request-topic: ims.executor-command-request
    command-response-topic: ims.executor-command-response
    task-request-topic: ims.executor-task-request
    task-response-topic: ims.executor-task-response
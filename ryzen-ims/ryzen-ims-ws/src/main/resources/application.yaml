server:
  port: 8042
  shutdown: graceful

spring:
  application:
    name: ryzen-ims-ws
  profiles:
    active: test
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    consul:
      discovery:
        instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
        service-name: ${spring.application.name}
        prefer-ip-address: true
        health-check-critical-timeout: 2m
      config:
        prefixes: config
        default-context: application
        data-key: data
        format: yaml
        watch:
          enabled: false # https://github.com/spring-cloud/spring-cloud-consul/issues/951
          delay: 3000
    function:
      definition: 'imsImMessageSource'
    stream:
      kafka:
        binder:
          brokers: ${ryzen.kafka.default.servers}
          configuration:
            auto.offset.reset: latest
      bindings:
        # ------------------------------------- source -------------------------------------
        imsImMessageSource-in-0:
          destination: ims.im-message
          content-type: application/json
          group: ${spring.application.name}
  output:
    ansi:
      enabled: detect
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ryzen.mysql.default.host}/${ryzen.mysql.default.schema}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${ryzen.mysql.default.username}
    password: ${ryzen.mysql.default.password}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: 'cli'
      display-name: '命令行'
      paths-to-match:
        - '/cli/**'
    - group: 'tenant-app'
      display-name: '租户-APP'
      paths-to-match:
        - '/tenant/app/**'
    - group: 'oem-app'
      display-name: 'OEM-APP'
      paths-to-match:
        - '/oem/app/**'
    - group: 'saas-app'
      display-name: 'SaaS-APP'
      paths-to-match:
        - '/saas/app/**'
